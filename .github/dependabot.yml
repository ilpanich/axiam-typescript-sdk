# .github/dependabot.yml
# Automated dependency updates — D-16 (CONTEXT.md), CI-03.
# Mirrors the AXIAM monorepo's dependabot style: weekly on Monday, with minor
# and patch bumps grouped into a single PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # @nestjs/core declares `peer @nestjs/common@^<its own major>`, so the two
      # can only move together. A major bump falls outside minor-patch below, so
      # ungrouped it arrives as one PR per package and each fails `npm ci` with
      # an ERESOLVE conflict against its still-unbumped sibling. Match every
      # update type, and keep this ahead of minor-patch: a dependency joins the
      # first group it matches.
      nestjs:
        patterns:
          - "@nestjs/*"
      minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # typedoc (used by `npm run docs`) has no TypeScript 7-compatible release:
      # its peerDependency caps at 6.0.x and it crashes at runtime under TS 7
      # (the compiler API it reaches into was rewritten). A TS 7 major bump
      # therefore breaks `npm ci` with an ERESOLVE peer conflict, which fails the
      # Coverage and SDK-CI workflows before any test runs. Hold TypeScript on the
      # major line typedoc supports; drop this ignore once typedoc ships TS 7.x
      # support. Minor/patch TypeScript updates still flow via the minor-patch group.
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # github/codeql-action/* are sub-actions of one release: init writes the
      # configuration file that analyze reads back, and analyze refuses a file
      # stamped with a different version. Split across separate PRs they land at
      # different versions and the CodeQL job fails with "Loaded a configuration
      # file for version X, but running version Y". Keep them in a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
