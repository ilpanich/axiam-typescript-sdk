name: SDK CI — TypeScript

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The gating matrix is floor + newest, not every line in between.
        # The floor is `engines.node` from package.json (22, the oldest line
        # still receiving security fixes — 18 went EOL 2025-04-30 and 20 on
        # 2026-04-30); the newest is the current release line (26, out
        # 2026-05, promoted to LTS 2026-10). 24 (Active LTS) sits between two
        # green legs.
        #
        # Both ends matter here for different reasons: the floor is what
        # `engines` promises an installer, and the newest is what
        # @types/node is pinned to — typechecking against APIs no tested
        # runtime provides is exactly the drift this matrix exists to catch.
        # test/core/versionPolicy.test.ts fails if these stop agreeing.
        node: ['22', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'

      # buf generate (below) needs the buf CLI.
      - name: Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1.5.0
        with:
          setup_only: true

      - name: Install dependencies
        run: npm ci

      # SEC-078: `npm ci` alone can mask a bad dependency pin if a stale
      # lockfile entry still satisfies the package.json range at install
      # time. Fail loudly and explicitly instead: `npm ls <pkg>` exits
      # non-zero whenever the resolved tree doesn't match what package.json
      # declares (missing, invalid, or extraneous), so a future repin that
      # can't resolve — or that drifts out of the range @types/amqplib is
      # built against (^0.10.x) — breaks the build here rather than
      # surfacing later as a silent runtime/type mismatch downstream.
      - name: Dependency resolution gate — amqplib pin resolves (SEC-078)
        if: matrix.node == '22'
        run: npm ls amqplib

      # src/gen stays gitignored (Phase 15 D-01); buf generate runs here as the
      # CI-time codegen step (buf.gen.yaml targets src/gen from the local
      # proto/ module with outputServices=grpc-js).
      - name: Generate proto stubs (buf generate)
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      # Docs gate: every export reachable from src/index.ts must carry a
      # TSDoc comment. typedoc.json wires excludeInternal (so @internal
      # cross-transport wiring like SharedSession.refreshGuard is exempt)
      # plus validation.notDocumented + treatValidationWarningsAsErrors, so
      # `npm run docs` itself already fails on regression — this step just
      # runs it in CI without publishing the generated _docs/ output.
      - name: Docs — no undocumented public API exports
        if: matrix.node == '22'
        run: npm run docs

      - name: Dependency vulnerability scan (CI-03)
        if: matrix.node == '22'
        run: npm audit --audit-level=high --omit=dev

      # SC#1 / D-02: end-to-end proof (not config trust) that the browser
      # persona never pulls in a Node-only transport. esbuild
      # --platform=browser makes a Node built-in (net/tls/dns/etc.) pulled
      # in transitively by @grpc/grpc-js or amqplib a hard build error
      # rather than a silent polyfill (RESEARCH Area 1).
      - name: Bundle-and-grep gate — no Node transports in the browser bundle (SC#1)
        if: matrix.node == '22'
        run: npm run bundle-grep

      # T-17-27: the dynamic `import('jose')` guard (17-03) that lets the
      # Node persona lazy-load jose must not throw ERR_REQUIRE_ESM when a
      # CommonJS consumer requires the built entry. This failure surfaces
      # only at first require of the CJS entry — invisible to
      # tsc/vitest/bundle-grep — so it needs its own post-build gate.
      - name: CJS-require smoke — grpc entry (T-17-27)
        run: node -e "require('./dist/grpc/index.js')"

      - name: CJS-require smoke — middleware entry (T-17-27)
        run: node -e "require('./dist/middleware/index.js')"

      # T-17-24: analog of the Rust SDK's `grep -r 'eyJ' target/debug/` leak
      # gate — no JWT-shaped ("eyJ"-prefixed) string may appear anywhere in
      # this SDK's own built output. Sensitive<T> (17-01) keeps token
      # values out of debug/log/serialized surfaces; this proves it holds
      # in the compiled artifact too.
      - name: Token-leak gate — no JWT-shaped strings in built output (T-17-24)
        if: matrix.node == '22'
        run: |
          if grep -r 'eyJ' dist/ 2>/dev/null | grep -v '^Binary file' | grep -q .; then
            echo "FAIL: found 'eyJ'-prefixed (JWT-shaped) strings in dist/"
            grep -r 'eyJ' dist/ 2>/dev/null | grep -v '^Binary file' || true
            exit 1
          fi
          echo "OK: no JWT-shaped strings found in dist/"

      # T-17-25 / CONTRACT §6: strict TLS is always on; the only escape
      # hatch is customCa — there must be no insecure/skip-verification
      # surface anywhere in the SDK's own source tree.
      - name: TLS-lint gate — no TLS-bypass patterns (CONTRACT §6, T-17-25)
        if: matrix.node == '22'
        run: |
          if grep -rniE 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED|insecureskipverify' src/ 2>/dev/null | grep -q .; then
            echo "FAIL: found a TLS-bypass pattern under src/"
            grep -rniE 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED|insecureskipverify' src/ || true
            exit 1
          fi
          echo "OK: no TLS-bypass patterns found under src/"

      # SC#5: proves the tarball is publish-ready (dist/ included; src/gen
      # and node_modules excluded via package.json's `files` allowlist)
      # without side effects. The publish job re-runs this same command
      # before the real `npm publish`.
      - name: Dry-run publish gate (SC#5)
        if: matrix.node == '22'
        run: |
          set -euo pipefail
          # Same --tag rule as the publish job below: this gate runs on
          # whatever npm the runner image ships, so it passes today only
          # because that is still 10.x. Derive the tag here too rather than
          # wait for a runner bump to break the gate.
          pkg_version="$(node -p "require('./package.json').version")"
          case "${pkg_version}" in
            *-*) pre="${pkg_version#*-}"; pre="${pre%%.*}"
                 dist_tag="$(printf '%s' "${pre}" | sed 's/[0-9]*$//')"
                 [ -n "${dist_tag}" ] || dist_tag="next" ;;
            *)   dist_tag="latest" ;;
          esac
          npm publish --dry-run --tag "${dist_tag}"

  # CONTRACT §27.8: the management surface is generated from the vendored
  # management-registry.json and committed. This fails when the two have
  # drifted -- which happens whenever the registry is re-vendored and nobody
  # re-ran the generator, and which would otherwise ship 146 methods pointing
  # at last release's routes.
  #
  # R-2 (T-235): this was a step inside the `test` job, which is
  # `pull_request`-only, so a stale surface reaching a tag by any route other
  # than `scripts/mass-tag.sh` met no repository-side gate at all — and npm
  # never lets a version number be reused. It is its own job now, with no
  # `if:`, so it runs on tag pushes too without dragging the whole two-Node
  # test matrix onto a trigger it does not run on today. The `publish` job
  # `needs:` it.
  #
  # The generator reads the two vendored JSON artifacts and writes TypeScript
  # with `node:fs` alone — no dependency, so no `npm ci` and no buf here.
  management-drift-check:
    name: §27 management surface drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Fail on drift — committed §27 surface must match the registry
        run: node scripts/gen-management.mjs --check

  # Publishing to npm is IRREVERSIBLE — a version number can never be reclaimed.
  # Git tags are NOT branch-scoped, so without this gate a release tag cut on a
  # feature branch would ship unreviewed code to the world. The publish job
  # below `needs:` this.
  verify-tag-on-main:
    name: Verify tag is on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT on origin/main. Release tags must be cut from main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on origin/main."

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [management-drift-check, verify-tag-on-main]
    runs-on: ubuntu-latest
    # Manual-on-tag, side-effecting job: only runs when a maintainer pushes a
    # vX.Y.Z tag. It is never triggered by a PR (T-17-26), so no publishing
    # credential is ever reachable from a PR-triggered job.
    #
    # AUTHENTICATION: Trusted Publishing (OIDC). `axiam-sdk` has a trusted
    # publisher configured on npmjs.com naming this repository, this workflow
    # file, and the `production` environment below. There is no npm token in
    # this job by design — npm prefers an explicit token over OIDC, so a token
    # present would mean the trusted publisher is configured and never used.
    #
    # The environment name is part of the OIDC claim, so it must keep matching
    # what is configured npm-side. Changing or removing it here fails the
    # publish with an opaque authentication error rather than a useful one.
    environment: production
    permissions:
      contents: read
      id-token: write   # required for npm provenance (OIDC), D-21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1, and Node 22 ships npm 10.x —
      # which does not know about it at all and would silently fall back to
      # looking for NODE_AUTH_TOKEN. Without this step, enabling Trusted
      # Publishing appears to do nothing.
      - name: Upgrade npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      # Prove the OIDC half of Trusted Publishing is actually present, here,
      # in two seconds — rather than after `npm ci`, codegen and a full build.
      #
      # This job publishes with no token at all, so `id-token: write` and a new
      # enough npm ARE the credential. If either is missing, npm reports a
      # generic authentication failure that reads like a registry problem. Say
      # it plainly instead.
      - name: Verify this job can use Trusted Publishing
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          echo "npm version:      ${npm_version}"
          echo "package:          $(node -p "require('./package.json').name")"
          echo "job environment:  production"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available, so Trusted Publishing cannot run."
            echo "::error::This job needs 'permissions: id-token: write'."
            exit 1
          fi
          echo "OIDC token:       available"
          # Trusted Publishing landed in npm 11.5.1 exactly. Below that npm
          # does not know about it at all and silently looks for a token this
          # job deliberately does not have. Compared with `sort -V` rather than
          # by splitting on dots, so 11.5.0 — the one version a major/minor
          # comparison waves through — is caught too.
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} predates Trusted Publishing (needs >= 11.5.1)."
            exit 1
          fi
          echo "==> Publishing via Trusted Publishing (OIDC), with no npm token."
          echo "    npmjs.com must have a trusted publisher for this package naming"
          echo "    this repository, .github/workflows/sdk-ci-typescript.yml and the"
          echo "    'production' environment. The OIDC claim carries all three, and a"
          echo "    mismatch surfaces as an authentication error, not a config error."

      - name: Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1.5.0
        with:
          setup_only: true

      - name: Install dependencies
        run: npm ci

      # npm rejects a re-published version and a tag can outlive a forgotten
      # version bump, so assert the tag and package.json agree BEFORE any
      # publish side effect rather than discovering the mismatch afterwards.
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version ${tag_version}, but package.json says ${pkg_version}."
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches package.json version ${pkg_version}."

          # npm >= 11 refuses to publish a prerelease without an explicit
          # --tag, and it is right to: without one the release would land on
          # `latest`, so a plain `npm install @axiam/sdk` would hand every
          # consumer an alpha. Derive the dist-tag from the version rather
          # than hard-coding it, so the same workflow serves 1.0.0-alpha30
          # (alpha), 1.0.0-rc.1 (rc) and 1.0.0 (latest) with no edit.
          case "${tag_version}" in
            *-*)
              pre="${tag_version#*-}"     # 1.0.0-alpha30 -> alpha30, 1.0.0-rc.1 -> rc.1
              pre="${pre%%.*}"            # rc.1 -> rc
              dist_tag="$(printf '%s' "${pre}" | sed 's/[0-9]*$//')"   # alpha30 -> alpha
              # A purely numeric prerelease (1.0.0-30) leaves nothing behind;
              # `next` keeps it off `latest`, which is the property that matters.
              [ -n "${dist_tag}" ] || dist_tag="next"
              ;;
            *)
              dist_tag="latest"
              ;;
          esac
          echo "NPM_DIST_TAG=${dist_tag}" >> "${GITHUB_ENV}"
          echo "npm dist-tag: ${dist_tag}"

      # D-20: regenerate-and-bundle the compiled ts-proto stubs before
      # publishing so npm consumers (who cannot run buf) get a
      # self-contained package.
      - name: Regenerate and bundle proto stubs (D-20)
        run: npm run generate && npm run build

      - name: Verify package before publish (SC#5)
        run: npm publish --dry-run --tag "${NPM_DIST_TAG}"

      # No `env:` block, and that is the point: npm prefers an explicit token
      # over OIDC, so a NODE_AUTH_TOKEN here would mean the trusted publisher
      # is configured and never used, and the provenance attestation — the
      # reason for the whole exercise — would be decorative.
      #
      # T-148 / H-1: no separate `attest-build-provenance` step, because
      # `--provenance` already produces one. npm's provenance is a Sigstore
      # attestation over the published tarball, signed with this workflow's
      # OIDC identity and recorded in Rekor — the same construction, published
      # where the consumer already looks (`npm audit signatures`). A second
      # attestation in GitHub's store would say the same thing in a place npm
      # users do not check.
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance --tag "${NPM_DIST_TAG}"
