name: SDK CI — TypeScript

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # buf generate (below) needs the buf CLI.
      - name: Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1.5.0
        with:
          setup_only: true

      - name: Install dependencies
        run: npm ci

      # SEC-078: `npm ci` alone can mask a bad dependency pin if a stale
      # lockfile entry still satisfies the package.json range at install
      # time. Fail loudly and explicitly instead: `npm ls <pkg>` exits
      # non-zero whenever the resolved tree doesn't match what package.json
      # declares (missing, invalid, or extraneous), so a future repin that
      # can't resolve — or that drifts out of the range @types/amqplib is
      # built against (^0.10.x) — breaks the build here rather than
      # surfacing later as a silent runtime/type mismatch downstream.
      - name: Dependency resolution gate — amqplib pin resolves (SEC-078)
        run: npm ls amqplib

      # src/gen stays gitignored (Phase 15 D-01); buf generate runs here as the
      # CI-time codegen step (buf.gen.yaml targets src/gen from the local
      # proto/ module with outputServices=grpc-js).
      - name: Generate proto stubs (buf generate)
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      # Docs gate: every export reachable from src/index.ts must carry a
      # TSDoc comment. typedoc.json wires excludeInternal (so @internal
      # cross-transport wiring like SharedSession.refreshGuard is exempt)
      # plus validation.notDocumented + treatValidationWarningsAsErrors, so
      # `npm run docs` itself already fails on regression — this step just
      # runs it in CI without publishing the generated _docs/ output.
      - name: Docs — no undocumented public API exports
        run: npm run docs

      - name: Dependency vulnerability scan (CI-03)
        run: npm audit --audit-level=high --omit=dev

      # SC#1 / D-02: end-to-end proof (not config trust) that the browser
      # persona never pulls in a Node-only transport. esbuild
      # --platform=browser makes a Node built-in (net/tls/dns/etc.) pulled
      # in transitively by @grpc/grpc-js or amqplib a hard build error
      # rather than a silent polyfill (RESEARCH Area 1).
      - name: Bundle-and-grep gate — no Node transports in the browser bundle (SC#1)
        run: npm run bundle-grep

      # T-17-27: the dynamic `import('jose')` guard (17-03) that lets the
      # Node persona lazy-load jose must not throw ERR_REQUIRE_ESM when a
      # CommonJS consumer requires the built entry. This failure surfaces
      # only at first require of the CJS entry — invisible to
      # tsc/vitest/bundle-grep — so it needs its own post-build gate.
      - name: CJS-require smoke — grpc entry (T-17-27)
        run: node -e "require('./dist/grpc/index.js')"

      - name: CJS-require smoke — middleware entry (T-17-27)
        run: node -e "require('./dist/middleware/index.js')"

      # T-17-24: analog of the Rust SDK's `grep -r 'eyJ' target/debug/` leak
      # gate — no JWT-shaped ("eyJ"-prefixed) string may appear anywhere in
      # this SDK's own built output. Sensitive<T> (17-01) keeps token
      # values out of debug/log/serialized surfaces; this proves it holds
      # in the compiled artifact too.
      - name: Token-leak gate — no JWT-shaped strings in built output (T-17-24)
        run: |
          if grep -r 'eyJ' dist/ 2>/dev/null | grep -v '^Binary file' | grep -q .; then
            echo "FAIL: found 'eyJ'-prefixed (JWT-shaped) strings in dist/"
            grep -r 'eyJ' dist/ 2>/dev/null | grep -v '^Binary file' || true
            exit 1
          fi
          echo "OK: no JWT-shaped strings found in dist/"

      # T-17-25 / CONTRACT §6: strict TLS is always on; the only escape
      # hatch is customCa — there must be no insecure/skip-verification
      # surface anywhere in the SDK's own source tree.
      - name: TLS-lint gate — no TLS-bypass patterns (CONTRACT §6, T-17-25)
        run: |
          if grep -rniE 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED|insecureskipverify' src/ 2>/dev/null | grep -q .; then
            echo "FAIL: found a TLS-bypass pattern under src/"
            grep -rniE 'rejectUnauthorized\s*:\s*false|NODE_TLS_REJECT_UNAUTHORIZED|insecureskipverify' src/ || true
            exit 1
          fi
          echo "OK: no TLS-bypass patterns found under src/"

      # SC#5: proves the tarball is publish-ready (dist/ included; src/gen
      # and node_modules excluded via package.json's `files` allowlist)
      # without side effects. The publish job re-runs this same command
      # before the real `npm publish`.
      - name: Dry-run publish gate (SC#5)
        run: |
          set -euo pipefail
          # Same --tag rule as the publish job below: this gate runs on
          # whatever npm the runner image ships, so it passes today only
          # because that is still 10.x. Derive the tag here too rather than
          # wait for a runner bump to break the gate.
          pkg_version="$(node -p "require('./package.json').version")"
          case "${pkg_version}" in
            *-*) pre="${pkg_version#*-}"; pre="${pre%%.*}"
                 dist_tag="$(printf '%s' "${pre}" | sed 's/[0-9]*$//')"
                 [ -n "${dist_tag}" ] || dist_tag="next" ;;
            *)   dist_tag="latest" ;;
          esac
          npm publish --dry-run --tag "${dist_tag}"

  # Publishing to npm is IRREVERSIBLE — a version number can never be reclaimed.
  # Git tags are NOT branch-scoped, so without this gate a release tag cut on a
  # feature branch would ship unreviewed code to the world. The publish job
  # below `needs:` this.
  verify-tag-on-main:
    name: Verify tag is on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT on origin/main. Release tags must be cut from main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on origin/main."

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    # Manual-on-tag, side-effecting job: only runs when a maintainer pushes a
    # vX.Y.Z tag. It is never triggered by a PR, so NPM_TOKEN is never exposed
    # to PR-triggered jobs (T-17-26).
    # [TRUSTED PUBLISHING] The npm trusted-publisher configuration for this
    # package points at THIS workflow. If that configuration names a GitHub
    # environment, this job must declare the same one or the OIDC claim will not
    # match and the publish fails with an opaque authentication error. Uncomment
    # and set it to whatever was configured npm-side.
    environment: production
    permissions:
      contents: read
      id-token: write   # required for npm provenance (OIDC), D-21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1, and Node 22 ships npm 10.x —
      # which does not know about it at all and would silently fall back to
      # looking for NODE_AUTH_TOKEN. Without this step, enabling Trusted
      # Publishing appears to do nothing.
      - name: Upgrade npm (Trusted Publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      # Which credential will npm ACTUALLY use? Answer it here, in two seconds,
      # instead of after `npm ci`, codegen and a full build — and answer it
      # without printing the secret.
      #
      # "Trusted Publishing is configured" and "Trusted Publishing is being
      # used" are different claims, and nothing else in this job distinguishes
      # them. setup-node writes `_authToken` into the job's .npmrc from
      # NODE_AUTH_TOKEN, and npm prefers an explicit token over OIDC — so while
      # that secret is set, TP never engages however carefully it was set up on
      # npmjs.com. A publish that "works" then proves nothing about TP, and a
      # publish that fails after the token is revoked looks like an npm outage.
      - name: Report which npm credential this job will use
        env:
          NPM_TOKEN_PRESENT: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          set -euo pipefail
          echo "npm version:       $(npm --version)"
          echo "package:           $(node -p "require('./package.json').name")"
          echo "job environment:   ${GITHUB_JOB} / production"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC token:        available"
          else
            echo "OIDC token:        NOT available (id-token: write missing?)"
          fi
          echo "NPM_TOKEN secret:  ${NPM_TOKEN_PRESENT}"
          if [ "${NPM_TOKEN_PRESENT}" = "true" ]; then
            echo "==> This job will authenticate with the NPM_TOKEN secret."
            echo "    Trusted Publishing will NOT engage while that secret is set."
            echo "    To actually switch to TP, delete the NODE_AUTH_TOKEN env block"
            echo "    on the publish step below (marked [TRUSTED PUBLISHING] 2/3)."
          elif [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "==> No NPM_TOKEN secret: this job will authenticate via Trusted"
            echo "    Publishing (OIDC). npmjs.com must have a trusted publisher for"
            echo "    this package naming this repository, this workflow file, and"
            echo "    the 'production' environment — the OIDC claim carries all three"
            echo "    and a mismatch fails with an opaque authentication error."
          else
            echo "::error::No NPM_TOKEN secret and no OIDC token — this publish cannot authenticate."
            exit 1
          fi

      - name: Install buf
        uses: bufbuild/buf-action@8c6a16e16f12ba20b6470afa9c2ba9b5ba8c97c3  # v1.5.0
        with:
          setup_only: true

      - name: Install dependencies
        run: npm ci

      # npm rejects a re-published version and a tag can outlive a forgotten
      # version bump, so assert the tag and package.json agree BEFORE any
      # publish side effect rather than discovering the mismatch afterwards.
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "${tag_version}" != "${pkg_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} implies version ${tag_version}, but package.json says ${pkg_version}."
            exit 1
          fi
          echo "OK: tag ${GITHUB_REF_NAME} matches package.json version ${pkg_version}."

          # npm >= 11 refuses to publish a prerelease without an explicit
          # --tag, and it is right to: without one the release would land on
          # `latest`, so a plain `npm install @axiam/sdk` would hand every
          # consumer an alpha. Derive the dist-tag from the version rather
          # than hard-coding it, so the same workflow serves 1.0.0-alpha30
          # (alpha), 1.0.0-rc.1 (rc) and 1.0.0 (latest) with no edit.
          case "${tag_version}" in
            *-*)
              pre="${tag_version#*-}"     # 1.0.0-alpha30 -> alpha30, 1.0.0-rc.1 -> rc.1
              pre="${pre%%.*}"            # rc.1 -> rc
              dist_tag="$(printf '%s' "${pre}" | sed 's/[0-9]*$//')"   # alpha30 -> alpha
              # A purely numeric prerelease (1.0.0-30) leaves nothing behind;
              # `next` keeps it off `latest`, which is the property that matters.
              [ -n "${dist_tag}" ] || dist_tag="next"
              ;;
            *)
              dist_tag="latest"
              ;;
          esac
          echo "NPM_DIST_TAG=${dist_tag}" >> "${GITHUB_ENV}"
          echo "npm dist-tag: ${dist_tag}"

      # D-20: regenerate-and-bundle the compiled ts-proto stubs before
      # publishing so npm consumers (who cannot run buf) get a
      # self-contained package.
      - name: Regenerate and bundle proto stubs (D-20)
        run: npm run generate && npm run build

      - name: Verify package before publish (SC#5)
        run: npm publish --dry-run --tag "${NPM_DIST_TAG}"

      - name: Publish to npm with provenance
        # [TRUSTED PUBLISHING] Delete this `env:` block once Trusted Publishing
        # is live. A token present takes precedence over OIDC, so leaving it
        # would mean Trusted Publishing is configured and never used — the
        # publish would keep working, from the token, and the configuration
        # would be decorative.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance --tag "${NPM_DIST_TAG}"
